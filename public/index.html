<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GonStudy AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #131314;
            --sidebar-bg: #1e1f20;
            --card-bg: #1e1f20;
            --card-hover: #28292a;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --gemini-blue: #4285f4;
            --gemini-purple: #9b51e0;
            --gemini-pink: #d946ef;
            
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --text-muted: #8e918f;
            
            --sidebar-width: 260px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.22s ease-out;
            display: flex;
            flex-direction: column;
            padding: 0.8rem;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0.4rem 0.8rem 0.4rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
        }

        .brand i {
            background: linear-gradient(135deg, var(--gemini-blue), var(--gemini-purple), var(--gemini-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.2rem;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
        }

        .close-btn:hover {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.65rem 0.8rem;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: background 0.15s;
        }

        .new-chat-btn:hover {
            background: var(--card-bg);
        }

        .history-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin: 0.5rem 0.4rem;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 0.8rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 0.8rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            border-radius: var(--radius-sm);
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gemini-blue), var(--gemini-purple));
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        .top-bar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.2rem;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(19, 19, 20, 0.95);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.05rem;
        }

        .icon-btn:hover {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .model-selector {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
        }

        .model-selector span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.85rem;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 80px 1rem 180px 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
            text-align: center;
        }

        .welcome-section {
            margin-bottom: 0.5rem;
            margin-top: 10vh;
        }

        .welcome-title {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--gemini-blue) 0%, var(--gemini-purple) 50%, var(--gemini-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .chat-stream {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            text-align: left;
        }

        .msg-row {
            display: flex;
            gap: 14px;
            line-height: 1.6;
            font-size: 0.93rem;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-row.bot .msg-avatar {
            background: linear-gradient(135deg, var(--gemini-blue), var(--gemini-purple));
            color: #fff;
        }

        .msg-row.user .msg-avatar {
            background: var(--card-hover);
            color: var(--text-primary);
        }

        .msg-content {
            flex: 1;
            color: var(--text-primary);
            word-break: break-word;
        }

        .msg-row.user .msg-content {
            background: var(--card-bg);
            padding: 0.75rem 1.1rem;
            border-radius: 18px;
            display: inline-block;
        }

        .bottom-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(19,19,20,0) 0%, rgba(19,19,20,0.85) 25%, rgba(19,19,20,1) 100%);
            padding: 1rem 1rem 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .input-box-wrapper {
            width: 100%;
            max-width: 760px;
            position: relative;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(66, 133, 244, 0.35), rgba(155, 81, 224, 0.25), rgba(217, 70, 239, 0.35));
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .input-box-wrapper:focus-within {
            background: linear-gradient(135deg, var(--gemini-blue), var(--gemini-purple), var(--gemini-pink));
            box-shadow: 0 0 20px rgba(155, 81, 224, 0.3);
        }

        .input-box {
            background: #212121;
            border-radius: 23px;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
        }

        .chat-textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.98rem;
            resize: none;
            height: 48px;
            line-height: 1.5;
        }

        .chat-textarea::placeholder {
            color: #7d7e80;
        }

        .input-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .action-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn {
            background: #383838;
            color: #888;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn.active {
            background: linear-gradient(135deg, var(--gemini-blue), var(--gemini-purple));
            color: #fff;
            box-shadow: 0 2px 10px rgba(66, 133, 244, 0.4);
        }

        .pills-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 760px;
        }

        .pill-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #d1d5db;
            padding: 0.45rem 0.95rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .pill-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.35);
            color: #fff;
            box-shadow: 0 0 10px rgba(155, 81, 224, 0.15);
        }

        .loading-dots span {
            animation: blink 1.4s infinite both;
            font-weight: bold;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }

        @media (max-width: 640px) {
            .welcome-title {
                font-size: 2rem;
            }
            .pills-bar {
                gap: 6px;
            }
            .pill-btn {
                padding: 0.35rem 0.75rem;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

    <div class="drawer-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <i class="fa-solid fa-sparkles"></i>
                <span>GonStudy AI</span>
            </div>
            <button class="close-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <button class="new-chat-btn" onclick="resetChat()">
            <i class="fa-solid fa-plus"></i>
            <span>Nuevo Chat</span>
        </button>

        <div class="history-title">Recientes</div>
        <div class="history-list">
            <a class="history-item"><i class="fa-regular fa-message"></i> Cuestionario de Biología</a>
            <a class="history-item"><i class="fa-regular fa-message"></i> Resumen de Historia 5°</a>
            <a class="history-item"><i class="fa-regular fa-message"></i> V o F - Física Teórica</a>
            <a class="history-item"><i class="fa-regular fa-message"></i> Multiple Choice Geografía</a>
        </div>

        <div class="sidebar-user">
            <div class="user-avatar">G</div>
            <span style="font-size:0.88rem; font-weight:500;">Gonzalo Davanzo</span>
        </div>
    </aside>

    <div class="main-wrapper">
        
        <header class="top-bar">
            <button class="icon-btn" onclick="toggleSidebar()" title="Menú">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="model-selector">
                GonStudy <span>AI</span>
            </div>
            <button class="icon-btn" onclick="resetChat()" title="Nuevo Chat">
                <i class="fa-regular fa-pen-to-square"></i>
            </button>
        </header>

        <div class="content-scroll" id="scrollContainer">
            <div class="content-container">
                
                <div class="welcome-section" id="welcomeSec">
                    <h1 class="welcome-title">
                        <i class="fa-solid fa-sparkles"></i> ¿En qué puedo ayudarte, Gonza?
                    </h1>
                </div>

                <div class="chat-stream" id="chatStream"></div>

            </div>
        </div>

        <div class="bottom-container">
            
            <div class="input-box-wrapper">
                <div class="input-box">
                    <textarea class="chat-textarea" id="userInput" placeholder="Escribe un mensaje o elige una opción..." oninput="handleInput()" onkeydown="checkEnter(event)"></textarea>
                    
                    <div class="input-actions">
                        <div class="action-left">
                            <button class="icon-btn" style="width:30px; height:30px;" title="Adjuntar archivo">
                                <i class="fa-solid fa-paperclip" style="font-size:0.88rem;"></i>
                            </button>
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendPrompt()" title="Enviar">
                            <i class="fa-solid fa-arrow-up" style="font-size:0.9rem;"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="pills-bar">
                <button class="pill-btn" onclick="triggerOption('Arma un examen de Verdadero o Falso sobre el tema que te daré a continuación:')">
                    <i class="fa-solid fa-circle-check"></i> Verdadero o Falso
                </button>
                <button class="pill-btn" onclick="triggerOption('Crea un cuestionario Multiple Choice de 5 preguntas sobre:')">
                    <i class="fa-solid fa-list-check"></i> Multiple Choice
                </button>
                <button class="pill-btn" onclick="triggerOption('Genera un cuestionario completo con preguntas de desarrollo sobre:')">
                    <i class="fa-solid fa-clipboard-question"></i> Cuestionario
                </button>
                <button class="pill-btn" onclick="triggerOption('Realiza un resumen estructurado y detallado sobre:')">
                    <i class="fa-solid fa-file-lines"></i> Resumen
                </button>
                <button class="pill-btn" onclick="triggerOption('Haz un quiz interactivo rápido de 3 preguntas sobre:')">
                    <i class="fa-solid fa-bolt"></i> Quiz Rápido
                </button>
                <button class="pill-btn" onclick="triggerOption('Explícame paso a paso y de forma sencilla el concepto de:')">
                    <i class="fa-solid fa-ellipsis"></i> Explicar Paso a Paso
                </button>
            </div>

        </div>

    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function handleInput() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            if (input.value.trim().length > 0) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        }

        function triggerOption(promptText) {
            const input = document.getElementById('userInput');
            input.value = promptText + ' ';
            input.focus();
            handleInput();
        }

        async function sendPrompt() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const welcomeSec = document.getElementById('welcomeSec');
            if (welcomeSec) welcomeSec.style.display = 'none';

            const chatStream = document.getElementById('chatStream');

            const userMsg = document.createElement('div');
            userMsg.className = 'msg-row user';
            userMsg.innerHTML = `
                <div class="msg-avatar">G</div>
                <div class="msg-content">${escapeHTML(text)}</div>
            `;
            chatStream.appendChild(userMsg);

            input.value = '';
            handleInput();

            const container = document.getElementById('scrollContainer');
            container.scrollTop = container.scrollHeight;

            const botMsg = document.createElement('div');
            botMsg.className = 'msg-row bot';
            const msgId = 'msg-' + Date.now();
            botMsg.innerHTML = `
                <div class="msg-avatar"><i class="fa-solid fa-sparkles"></i></div>
                <div class="msg-content" id="${msgId}">
                    <span class="loading-dots">Procesando respuesta con Gemini <span>.</span><span>.</span><span>.</span></span>
                </div>
            `;
            chatStream.appendChild(botMsg);
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                const contentEl = document.getElementById(msgId);

                if (response.ok) {
                    contentEl.innerHTML = formatMarkdown(data.reply);
                } else {
                    contentEl.innerHTML = `<span style="color:#ff6b6b;">Error: ${escapeHTML(data.error || 'No se pudo obtener respuesta.')}</span>`;
                }
            } catch (err) {
                const contentEl = document.getElementById(msgId);
                contentEl.innerHTML = `<span style="color:#ff6b6b;">Error de conexión con la API backend.</span>`;
            }

            container.scrollTop = container.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        }

        function resetChat() {
            document.getElementById('chatStream').innerHTML = '';
            document.getElementById('userInput').value = '';
            const welcomeSec = document.getElementById('welcomeSec');
            if (welcomeSec) welcomeSec.style.display = 'block';
            handleInput();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag] || tag)
            );
        }

        function formatMarkdown(text) {
            let html = escapeHTML(text);
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/`(.*?)`/g, '<code style="background:#2d2d2d; padding:2px 6px; border-radius:4px;">$1</code>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }
    </script>
</body>
</html>
